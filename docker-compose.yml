services:
  yolo-api:
    build: .
    image: yolo-fastapi:latest
    ports:
      - "8000:8000"
    environment:
      DEFAULT_CONF: "0.25"
      DEFAULT_IOU: "0.45"
      IMG_SIZE: "640"
      DEFAULT_MODEL: "yolo11n"
    # Every .pt file in ./models is served. Add, replace or delete files while it's running; no restart needed.
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
