services:
  yolo-api:
    build: .
    image: yolo-fastapi:latest
    ports:
      - "8000:8000"
    environment:
      DEFAULT_CONF: "0.25"
      DEFAULT_IOU: "0.45"
      IMG_SIZE: "640"
      # Model used when a request doesn't pass ?model=... (switch at runtime with PUT /model)
      DEFAULT_MODEL: "yolo11n"
      # Models to load, as name=path pairs. To add your own weights, mount them and append:
      # MODELS: "yolo11n=/app/models/yolo11n.pt,yolo11s=/app/models/yolo11s.pt,custom=/models/best.pt"
    # volumes:
    #   - ./models:/models:ro
    restart: unless-stopped
